[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simulated-nsl-eps"
version = "0.1.0"
description = "Simulated NSL Electrical Power System for PEROVSAT CubeSat -- tracks battery SOC, energy, and status."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
sim = ["bsk>=2.10.2"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["simulated_nsl_eps*"]