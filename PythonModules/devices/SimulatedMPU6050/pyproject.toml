[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simulated-mpu6050"
version = "0.1.0"
description = "Register-level simulation of the InvenSense MPU-6050 IMU, drivable from a Basilisk spacecraft simulation."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The Basilisk bridge (simulated_mpu6050.basilisk_adapter) needs a Basilisk
# install; the core sensor model does not. Kept optional so the package stays
# importable and testable on its own.
sim = ["bsk>=2.10.2"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["simulated_mpu6050*"]
